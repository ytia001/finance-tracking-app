<a
  mat-button
  class="sidebar-item d-flex flex-column align-items-center justify-content-center p-2 rounded-3"
  [routerLink]="item.route"
  routerLinkActive="active"
  [matTooltip]="item.showTooltip !== false ? item.tooltip : ''"
  matTooltipPosition="right"
>
  <mat-icon class="icon">{{ item.icon }}</mat-icon>
  <span class="label">{{ item.label }}</span>
</a>
