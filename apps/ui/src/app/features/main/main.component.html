<div class="app-layout">
  <aside class="sidenav">
    <nav class="nav-links">
      <a routerLink="/dashboard" class="link">Dashboard</a>
      <a routerLink="/breakdown" class="link">Breakdown</a>
      <a routerLink="/transactions" class="link">Transactions</a>
      <a routerLink="/configuration" class="link">Configuration</a>
    </nav>
  </aside>

  <div class="main">
    <app-header
      [isAuthenticated]="isAuthenticated()"
      [userName]="user()?.firstName ?? null"
      (sideNavClicked)="toggleSideNav()"
      (addFinanceClicked)="handleAddFinanceClicked()"
      (signInClicked)="handleSignInClicked()"
      (logoutClicked)="handleLogoutClicked()"
    ></app-header>

    <div class="content">
      <router-outlet></router-outlet>
    </div>

    <footer class="footer">Finance Tracker Footer</footer>
  </div>
</div>
