<mat-toolbar>
  <button matIconButton (click)="toggleSideNav()" aria-label="side nav menu">
    <mat-icon>menu</mat-icon>
  </button>
  <span>Finance Tracker</span>

  <span class="spacer"></span>

  @if (isAuthenticated) {
    <button matButton="tonal" (click)="clickAddFinanceButton()">Add Finances</button>

    <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-menu-button">
      <span class="user-name">{{ displayName }}</span>
    </button>

    <mat-menu #userMenu="matMenu">
      <button mat-menu-item>
        <mat-icon>person</mat-icon>
        <span>Profile</span>
      </button>
      <button mat-menu-item (click)="handleLogout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  } @else {
    <button matButton="tonal" (click)="clickAddFinanceButton()" disabled>Add Finances</button>

    <button mat-raised-button class="sign-in-button" (click)="clickSignInButton()">Sign In</button>
  }
</mat-toolbar>
