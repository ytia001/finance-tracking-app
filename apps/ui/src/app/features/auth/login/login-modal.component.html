<div class="login-modal-container">
  <div class="login-header">
    <div class="logo-container">
      <tui-icon icon="@tui.account_balance_wallet" class="logo-icon" />
    </div>
    <h1>Finance Tracker</h1>
    <p class="subtitle">Sign in to your account</p>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <tui-textfield class="full-width">
      <ng-template tui-label>Email</ng-template>
      <input
        tuiInput
        formControlName="email"
        type="email"
        autocomplete="email"
        placeholder="Enter your email"
      />
      <span tui-prefix>
        <tui-icon icon="@tui.mail" class="input-icon" />
      </span>
    </tui-textfield>

    <tui-textfield class="full-width">
      <ng-template tui-label>Password</ng-template>
      <input
        tuiInput
        formControlName="password"
        type="password"
        autocomplete="current-password"
        placeholder="Enter your password"
      />
      <span tui-prefix>
        <tui-icon icon="@tui.lock" class="input-icon" />
      </span>
    </tui-textfield>

    <div class="forgot-password">
      <button type="button" class="link-button">Forgot password?</button>
    </div>

    @if (loading()) {
      <tui-loader class="loading-bar" />
    }

    @if (error()) {
      <div class="error-message">
        <tui-icon icon="@tui.alert-circle" />
        <span>{{ error() }}</span>
      </div>
    }

    <div class="dialog-actions">
      <button tui-button type="button" (click)="closeDialog()" [disabled]="loading()">
        Cancel
      </button>
      <button
        tui-button
        appearance="primary"
        type="submit"
        [disabled]="loginForm.invalid || loading()"
      >
        @if (loading()) {
          <span>Signing in...</span>
        } @else {
          <span>Sign In</span>
        }
      </button>
    </div>
  </form>

  <p class="signup-link">
    Don't have an account?
    <button type="button" class="link-button" (click)="onSwitchToRegister()">Sign up</button>
  </p>
</div>
