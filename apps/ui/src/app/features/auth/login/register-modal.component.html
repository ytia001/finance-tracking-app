<div class="register-modal-container">
  <div class="register-header">
    <div class="logo-container">
      <tui-icon icon="@tui.account_balance_wallet" class="logo-icon" />
    </div>
    <h1>Create Account</h1>
    <p class="subtitle">Join Finance Tracker today</p>
  </div>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="name-fields">
      <tui-textfield class="half-width">
        <ng-template tui-label>First Name</ng-template>
        <input
          tuiInput
          formControlName="firstName"
          type="text"
          autocomplete="given-name"
          placeholder="John"
        />
        <span tui-prefix>
          <tui-icon icon="@tui.user" class="input-icon" />
        </span>
        <ng-template tui-field-error>First name is required</ng-template>
      </tui-textfield>

      <tui-textfield class="half-width">
        <ng-template tui-label>Last Name</ng-template>
        <input
          tuiInput
          formControlName="lastName"
          type="text"
          autocomplete="family-name"
          placeholder="Doe"
        />
        <span tui-prefix>
          <tui-icon icon="@tui.user" class="input-icon" />
        </span>
        <ng-template tui-field-error>Last name is required</ng-template>
      </tui-textfield>
    </div>

    <tui-textfield class="full-width">
      <ng-template tui-label>Email</ng-template>
      <input
        tuiInput
        formControlName="email"
        type="email"
        autocomplete="email"
        placeholder="john.doe@example.com"
      />
      <span tui-prefix>
        <tui-icon icon="@tui.mail" class="input-icon" />
      </span>
      <ng-template tui-field-error>Please enter a valid email</ng-template>
    </tui-textfield>

    <tui-textfield class="full-width">
      <ng-template tui-label>Password</ng-template>
      <input
        tuiInput
        formControlName="password"
        type="password"
        autocomplete="new-password"
        placeholder="At least 8 characters"
      />
      <span tui-prefix>
        <tui-icon icon="@tui.lock" class="input-icon" />
      </span>
      <ng-template tui-field-error>Password must be at least 8 characters</ng-template>
    </tui-textfield>

    @if (loading()) {
      <tui-loader class="loading-bar" />
    }

    @if (error()) {
      <div class="error-message">
        <tui-icon icon="@tui.alert-circle" />
        <span>{{ error() }}</span>
      </div>
    }

    <div class="dialog-actions">
      <button tui-button type="button" (click)="closeDialog()" [disabled]="loading()">
        Cancel
      </button>
      <button
        tui-button
        appearance="primary"
        type="submit"
        [disabled]="registerForm.invalid || loading()"
      >
        @if (loading()) {
          <span>Creating account...</span>
        } @else {
          <span>Sign Up</span>
        }
      </button>
    </div>
  </form>

  <p class="login-link">
    Already have an account?
    <button type="button" class="link-button" (click)="onSwitchToLogin()">Sign in</button>
  </p>
</div>
