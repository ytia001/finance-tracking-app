@let entries = (entries$ | async) ?? [];
@if (!entries.length) {
  <div class="empty-state">
    <tui-icon icon="@tui.chart-pie" class="empty-icon" />
    <p class="title">No data yet</p>
    <p class="subtitle">Add transactions to see your financial charts.</p>
  </div>
} @else {
  <div class="charts-container">
    <div class="chart-panel">
      <div class="panel-header">
        <span class="panel-title">Spending Breakdown</span>
        <span class="panel-description">Expenses by category</span>
      </div>
      <div class="chart-content">
        <app-pie-chart [entries]="entries" />
      </div>
    </div>

    <div class="chart-panel">
      <div class="panel-header">
        <span class="panel-title">Income vs Expenses</span>
        <span class="panel-description">Monthly trend over time</span>
      </div>
      <div class="chart-content">
        <app-line-chart [entries]="entries" />
      </div>
    </div>

    <div class="chart-panel">
      <div class="panel-header">
        <span class="panel-title">Monthly Overview</span>
        <span class="panel-description">Income and expenses per month</span>
      </div>
      <div class="chart-content">
        <app-bar-chart [entries]="entries" />
      </div>
    </div>
  </div>
}
