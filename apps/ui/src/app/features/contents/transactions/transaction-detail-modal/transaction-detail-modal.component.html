<div class="modal-header">
  <tui-icon [icon]="entry.categoryIcon" [ngClass]="isIncomeClass(entry)" class="category-icon" />
  <h2>Transaction Detail</h2>
</div>

<div class="modal-content">
  <hr class="mb-3" />

  <div class="detail-grid">
    <div class="detail-row">
      <span class="label">Category</span>
      <span class="value">{{ entry.categoryLabel }}</span>
    </div>
    <div class="detail-row">
      <span class="label">Amount</span>
      <span class="value" [ngClass]="isIncomeClass(entry)">
        {{ entry.isIncome ? '+' : '-' }}{{ entry.amount | currency }}
      </span>
    </div>
    <div class="detail-row">
      <span class="label">Date</span>
      <span class="value">{{ entry.date | date: 'fullDate' }}</span>
    </div>
    <div class="detail-row">
      <span class="label">Type</span>
      <span class="value">{{ entry.isIncome ? 'Income' : 'Expense' }}</span>
    </div>
  </div>

  <hr class="mt-3" />
</div>

<div class="modal-actions">
  <button tuiButton (click)="close()">Close</button>
  <button tuiButton appearance="secondary" disabled>Edit</button>
  <button tuiButton appearance="destructive" disabled>Delete</button>
</div>
