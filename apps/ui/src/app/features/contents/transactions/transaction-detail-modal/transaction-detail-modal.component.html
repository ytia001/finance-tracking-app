<h2 mat-dialog-title class="d-flex align-items-center gap-2">
  <mat-icon [ngClass]="isIncomeClass(entry)">{{ entry.categoryIcon }}</mat-icon>
  Transaction Detail
</h2>

<mat-dialog-content>
  <mat-divider class="mb-3"></mat-divider>

  <div class="d-flex flex-column gap-2">
    <div class="d-flex justify-content-between">
      <span class="text-muted small">Category</span>
      <span class="fw-medium small">{{ entry.categoryLabel }}</span>
    </div>
    <div class="d-flex justify-content-between">
      <span class="text-muted small">Amount</span>
      <span class="fw-semibold small" [ngClass]="isIncomeClass(entry)">
        {{ entry.isIncome ? '+' : '-' }}{{ entry.amount | currency }}
      </span>
    </div>
    <div class="d-flex justify-content-between">
      <span class="text-muted small">Date</span>
      <span class="small">{{ entry.date | date: 'fullDate' }}</span>
    </div>
    <div class="d-flex justify-content-between">
      <span class="text-muted small">Type</span>
      <span class="small">{{ entry.isIncome ? 'Income' : 'Expense' }}</span>
    </div>
  </div>

  <mat-divider class="mt-3"></mat-divider>
</mat-dialog-content>

<mat-dialog-actions class="justify-content-end">
  <button mat-button (click)="close()">Close</button>
  <!-- Edit & Delete — implementation deferred to separate ticket -->
  <button mat-button color="primary" disabled>Edit</button>
  <button mat-button color="warn" disabled>Delete</button>
</mat-dialog-actions>
