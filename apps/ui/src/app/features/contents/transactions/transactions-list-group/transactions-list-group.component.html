<div class="date-header">
  {{ dayGroup.dateId | date: 'fullDate' }}
</div>

@for (entry of dayGroup.entries; track entry.id) {
  <div
    class="entry-row"
    role="button"
    tabindex="0"
    (click)="onEntryClick(entry)"
    (keyup.enter)="onEntryClick(entry)"
  >
    <tui-icon [icon]="entry.categoryIcon" class="entry-icon" [ngClass]="isIncomeClass(entry)" />

    <div class="entry-details">
      <div class="entry-category">{{ entry.categoryLabel }}</div>
      <div class="entry-time">{{ entry.date | date: 'shortTime' }}</div>
    </div>

    <div class="entry-amount" [ngClass]="isIncomeClass(entry)">
      {{ entry.isIncome ? '+' : '-' }}{{ entry.amount | currency }}
    </div>
  </div>
}
