services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: fintrac
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: fintrac
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  pgdata:
